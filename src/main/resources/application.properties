# =====================================================================
# comercial-service - configuracion
# =====================================================================

spring.application.name=comercial-service

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.port=${SERVER_PORT:8083}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/comercial}

# ---------------------------------------------------------------------
# Base de datos (fndatabase, MySQL/MariaDB) - misma base que los demas servicios
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fndatabase}?useSSL=${DB_USE_SSL:false}&serverTimezone=${DB_TIMEZONE:America/Mexico_City}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# JWT - MISMO JWT_SECRET que auth-service; este servicio solo valida
# ---------------------------------------------------------------------
security.jwt.secret=${JWT_SECRET:ZG1lLWNhbWJpYS1lc3RlLXNlY3JldC1lbi1wcm9kdWNjaW9uLWZuY29uY3JldG9zLTIwMjY=}

# ---------------------------------------------------------------------
# Reglas de negocio: descuento estandar por forma de pago (mas alla de
# esto se requiere el permiso cotizaciones.aplicar_descuento_especial)
# ---------------------------------------------------------------------
negocio.descuento.max-efectivo=${DESCUENTO_MAX_EFECTIVO:5.0}
negocio.descuento.max-factura=${DESCUENTO_MAX_FACTURA:12.0}

# ---------------------------------------------------------------------
# Ruta diaria de asesores comerciales
# ---------------------------------------------------------------------
negocio.visitas.minimo-diario=${VISITAS_MINIMO_DIARIO:10}

# ---------------------------------------------------------------------
# catalogo-service: se consulta la tarifa de flete por vacio de la planta
# al cotizar (capacidad_referencia_m3 / precio_por_m3_vacio).
# ---------------------------------------------------------------------
catalogo-service.base-url=${CATALOGO_SERVICE_URL:http://localhost:8082/api/catalogo}

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.mx.fnconcretos.comercial=${LOG_LEVEL_APP:INFO}
